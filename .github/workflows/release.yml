name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deterministic manager bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/build-release-bundle.sh "$version" "rs-manager-$version.tar.gz"
          sha256sum "rs-manager-$version.tar.gz" >"rs-manager-$version.tar.gz.sha256"
          expected=$(sed -n 's/^EXPECTED_SHA256=//p' rs-manager.sh)
          actual=$(sha256sum "rs-manager-$version.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rs-manager-*.tar.gz
            rs-manager-*.tar.gz.sha256
          generate_release_notes: true
