name: RS Manager CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck python3
      - name: Run shell tests
        env:
          RS_VERIFY_PINNED_BUNDLE: 1
        run: bash tests/run.sh
      - name: Run ShellCheck
        run: shellcheck -x -e SC1090,SC1091,SC2015,SC2016,SC2119 install.sh rs-manager.sh bin/rs lib/core/*.sh lib/modules/*.sh scripts/*.sh tests/*.sh
      - name: Verify bootstrap bundle digest
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION=//p' rs-manager.sh)
          bash scripts/build-release-bundle.sh "$version" "/tmp/rs-manager-$version.tar.gz"
          expected=$(sed -n 's/^EXPECTED_SHA256=//p' rs-manager.sh)
          actual=$(sha256sum "/tmp/rs-manager-$version.tar.gz" | awk '{print $1}')
          printf 'bundle_sha256=%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Verify bundle checksums
        run: sha256sum -c checksums.txt

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.4
          cache-dependency-path: web/go.sum
      - run: go test ./...

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:3.21
            setup: apk add --no-cache bash coreutils curl findutils git grep iproute2 jq openssl python3 py3-tomli sed tar
          - image: rockylinux:9
            setup: dnf install -y bash diffutils findutils git grep iproute jq openssl python3.11 sed tar gzip && ln -sf /usr/bin/python3.11 /usr/bin/python3
    steps:
      - uses: actions/checkout@v4
      - name: Run shell tests in ${{ matrix.image }}
        run: >-
          docker run --rm -v "$PWD:/src" "${{ matrix.image }}" sh -c
          '${{ matrix.setup }} && cd /src && bash tests/run.sh'
